[package]
name = "mcp-tray"
version = "0.1.0"
edition = "2021"
description = "Cross-platform system tray for MCP Vector Proxy"

[[bin]]
name = "mcp-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "0.21"
tao = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
